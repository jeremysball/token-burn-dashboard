[tools]
bun = "1.3.11"
node = "26.5.1"

[tasks.dev]
description = "Run the dashboard in dev mode (Vite + Bun server) bound to the Tailnet IP"
run = """
#!/usr/bin/env bash
set -euo pipefail

port="${PORT:-7071}"
tailnet_ip="$(tailscale ip -4)"

if [ -z "$tailnet_ip" ]; then
    echo "Unable to determine a Tailnet IPv4 address." >&2
    exit 1
fi

ui_pid=""
server_pid=""
cleanup() {
    [ -z "$ui_pid" ] || kill "$ui_pid" 2>/dev/null || true
    [ -z "$server_pid" ] || kill "$server_pid" 2>/dev/null || true
}
trap cleanup EXIT INT TERM

bun run dev:ui -- --host "$tailnet_ip" &
ui_pid=$!

HOST="$tailnet_ip" PORT="$port" bun run dev &
server_pid=$!

for _ in $(seq 1 30); do
    if curl --fail --silent "http://$tailnet_ip:$port/api/health" >/dev/null; then
        echo "Dashboard is ready at http://$tailnet_ip:$port"
        wait "$server_pid"
        exit $?
    fi
    sleep 1
done

echo "Dashboard did not become healthy at http://$tailnet_ip:$port/api/health" >&2
exit 1
"""

[tasks.prod]
description = "Build the UI and run the dashboard in production mode bound to the Tailnet IP"
run = """
#!/usr/bin/env bash
set -euo pipefail

port="${PORT:-7071}"
tailnet_ip="$(tailscale ip -4)"

if [ -z "$tailnet_ip" ]; then
    echo "Unable to determine a Tailnet IPv4 address." >&2
    exit 1
fi

server_pid=""
cleanup() {
    [ -z "$server_pid" ] || kill "$server_pid" 2>/dev/null || true
}
trap cleanup EXIT INT TERM

bun run build:ui
HOST="$tailnet_ip" PORT="$port" bun run start &
server_pid=$!

for _ in $(seq 1 30); do
    if curl --fail --silent "http://$tailnet_ip:$port/api/health" >/dev/null; then
        echo "Dashboard is ready at http://$tailnet_ip:$port"
        wait "$server_pid"
        exit $?
    fi
    sleep 1
done

echo "Dashboard did not become healthy at http://$tailnet_ip:$port/api/health" >&2
exit 1
"""
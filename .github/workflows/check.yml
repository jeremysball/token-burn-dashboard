name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # Used to run as a 4-way matrix (lint, typecheck, unit, lifecycle), each
    # leg claiming its own GitHub-hosted runner. With several PRs open at
    # once that saturated this account's concurrent-runner cap and left legs
    # sitting `queued` for 10-20+ minutes with zero billable compute -- never
    # actually starting, just waiting on a slot. Collapsing to one job means
    # one runner request per push/PR instead of four, which is the actual
    # fix for the contention; it costs matrix parallelism (the legs now run
    # sequentially instead of side by side), a reasonable trade against
    # everything queuing indefinitely.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: lint
        run: bun run lint:baseline

      - name: typecheck
        run: bun run typecheck

      - name: unit
        run: bun test tests/unit --coverage --coverage-reporter=lcov && bun run coverage:check

      - name: lifecycle
        run: bun run test:lifecycle

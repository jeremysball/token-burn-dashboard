name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: check / ${{ matrix.leg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [lint, typecheck, unit, lifecycle]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: lint
        if: matrix.leg == 'lint'
        run: bun run lint:baseline

      - name: typecheck
        if: matrix.leg == 'typecheck'
        run: bun run typecheck

      - name: unit
        if: matrix.leg == 'unit'
        run: bun test tests/unit --coverage --coverage-reporter=lcov && bun run coverage:check

      - name: lifecycle
        if: matrix.leg == 'lifecycle'
        run: bun run test:lifecycle
